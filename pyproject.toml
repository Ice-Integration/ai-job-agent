[project]
name = "ai-job-agent"
version = "0.6.0"
description = "Evidence-backed AI agent for job discovery, qualification and application preparation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "openai>=1.68,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.4,<6",
  "python-docx>=1.1,<2",
  "redis>=5.2,<6",
  "structlog>=25,<26",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "pgvector>=0.3,<1",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "apscheduler>=3.11,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "respx>=0.22,<1",
  "asgi-lifespan>=2.1,<3"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
